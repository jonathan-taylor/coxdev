[project]
name = "coxdev"
dynamic = ["version"]
authors = [
    {name = "Jonathan Taylor", email="jonathan.taylor@stanford.edu" },
    {name = "Trevor Hastie", email="hastie@stanford.edu" },
    {name = "Balasubramanian Narasimhan", email="naras@stanford.edu" }
]  
description  = "Library for computing Cox deviance"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["Cox model"]
license = { text = "BSD-3-Clause" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering"
]
dependencies = [
    "numpy",
    "scipy",
]
maintainers = [
    {name = "Jonathan Taylor", email="jonathan.taylor@stanford.edu" },
]

[project.optional-dependencies]
test = ['pytest',
        'pandas']
# coxdev.jax
jax = ['jax']
dev = [
    "pytest",
    "scipy",
    "ninja",
    "meson",
    "meson-python",
    "pybind11",
    "setuptools_scm"
]
doc = [
    "myst-parser",
    "jupyter-book",
    "pandas",
    "matplotlib",
    "rpy2",
    "glmstar>=0.2.0",
    # doc/jax_timing.md
    "jax",
    # API reference (doc/api, Sphinx autodoc)
    "sphinx",
    "sphinx-book-theme"
]

[build-system]
requires = ["meson-python",
            "pybind11",
	    "numpy>=1.7.1",
	    "setuptools_scm",
	    "ninja",
	    "pybind11",
	    "meson"]
build-backend = "mesonpy"

[tool.setuptools_scm]
# This will use the latest git tag for the version

[tool.cibuildwheel]
# no 32-bit builds (no numpy/scipy wheels)
skip = ["*-win32", "*-manylinux_i686", "*-musllinux_i686"]

[tool.cibuildwheel.windows]
# build with MSVC: meson may otherwise pick a MinGW gcc on the PATH, whose
# runtime DLLs (libstdc++, libgcc_s, libwinpthread) the wheel doesn't ship,
# and Python doesn't look for an extension's DLLs on the PATH: the extension
# would not import ("DLL load failed while importing coxc"). The C++ runtime
# linked statically (b_vscrt=mt): Python ships vcruntime140.dll but not
# msvcp140.dll, which machines without the Visual C++ redistributable lack.
# And check that the wheel's extension loads and computes.
config-settings = {setup-args = ["--vsenv", "-Db_vscrt=mt"]}
test-command = "python -c \"import numpy as np; from coxdev import CoxDeviance; r = CoxDeviance(event=np.array([1., 2., 3.]), status=np.array([1, 0, 1]))(np.zeros(3), np.ones(3)); print(r.deviance)\""
