# Run all tests

name: Run tests (Linux)

# Controls when the workflow will run
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up Python  ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Test the C++ code
      run: |
        c++ -std=c++17 -O2 -Wall -Ieigen -Icpp/include cpp/src/coxdev.cpp cpp/tests/test_residuals_hazard.cpp -o test_residuals_hazard
        ./test_residuals_hazard
        c++ -std=c++17 -O2 -Wall -Ieigen -Icpp/include cpp/src/coxdev.cpp cpp/tests/test_concordance.cpp -o test_concordance
        ./test_concordance

    - name: Install coxdev
      run: |
        pip install --upgrade pip
        pip install meson-python ninja meson pybind11 setuptools_scm pytest pandas glmstar
        pip install .

    - name: Verify installed source
      run: |
        cd /tmp
        python -c "import coxdev.base; import inspect; print(inspect.getsourcefile(coxdev.base)); print(''.join(open(inspect.getsourcefile(coxdev.base)).readlines()[:20]))"

    - name: Debug Installation
      run: |
        cd /tmp
        python -c "import coxdev; print(f'Location: {coxdev.__file__}'); import os; print(f'Contents: {os.listdir(os.path.dirname(coxdev.__file__))}')"

    - name: Run the notebooks in doc
      run: |
        pip install jupytext nbconvert ipykernel matplotlib pandas
        for nb in using_coxdev sampling; do
          jupytext --to ipynb --execute doc/$nb.md --output "$RUNNER_TEMP/$nb.ipynb"
        done

    - name: Test coxdev
      run: |
        mkdir empty_dir
        cd empty_dir
        python -m pytest ../tests --test-size=100

  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    # --vsenv: build with MSVC (meson may otherwise pick a MinGW gcc on the
    # PATH, whose runtime DLLs Python doesn't find when importing). glmstar,
    # used by some tests, has no Windows wheels yet: from its sdist, with MSVC
    # too, against this coxdev
    - name: Install coxdev
      run: |
        python -m pip install --upgrade pip
        python -m pip install meson-python ninja meson pybind11 setuptools_scm pytest pandas
        python -m pip install . glmstar --no-binary glmstar -Csetup-args=--vsenv

    - name: Test coxdev
      run: |
        mkdir empty_dir
        cd empty_dir
        python -c "import coxdev, coxdev.coxc; print(coxdev.__file__)"
        python -m pytest ../tests --test-size=100
