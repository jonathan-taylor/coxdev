# Run all tests

name: Run tests

# Linux on pull requests; Linux, macOS and Windows on pushes to main (merges)
# and by hand. Changes only to the docs or Markdown files do not run the
# tests, except the two notebooks in doc that the tests execute.
on:
  push:
    branches: [ main ]
    paths: [ '**', '!doc/**', '!**.md', 'doc/using_coxdev.md', 'doc/sampling.md' ]
  pull_request:
    paths: [ '**', '!doc/**', '!**.md', 'doc/using_coxdev.md', 'doc/sampling.md' ]
  workflow_dispatch:

# a new push to a branch cancels the run still going for it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Test the C++ code
      run: |
        c++ -std=c++17 -O2 -Wall -Ieigen -Icpp/include cpp/src/coxdev.cpp cpp/tests/test_residuals_hazard.cpp -o test_residuals_hazard
        ./test_residuals_hazard
        c++ -std=c++17 -O2 -Wall -Ieigen -Icpp/include cpp/src/coxdev.cpp cpp/tests/test_concordance.cpp -o test_concordance
        ./test_concordance

    - name: Install coxdev
      run: |
        pip install --upgrade pip
        pip install meson-python ninja meson pybind11 setuptools_scm pytest pandas glmstar jax
        pip install .

    - name: Run the notebooks in doc
      run: |
        pip install jupytext nbconvert ipykernel matplotlib pandas
        for nb in using_coxdev sampling; do
          jupytext --to ipynb --execute doc/$nb.md --output "$RUNNER_TEMP/$nb.ipynb"
        done

    - name: Test coxdev
      run: |
        mkdir empty_dir
        cd empty_dir
        python -c "import coxdev; print(coxdev.__file__)"
        python -m pytest ../tests --test-size=100

  test-windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    # --vsenv: build with MSVC (meson may otherwise pick a MinGW gcc on the
    # PATH, whose runtime DLLs Python doesn't find when importing). glmstar,
    # used by some tests, has no Windows wheels yet: from its sdist, with MSVC
    # too, against this coxdev
    - name: Install coxdev
      run: |
        python -m pip install --upgrade pip
        python -m pip install meson-python ninja meson pybind11 setuptools_scm pytest pandas jax
        python -m pip install . glmstar --no-binary glmstar -Csetup-args=--vsenv

    - name: Test coxdev
      run: |
        mkdir empty_dir
        cd empty_dir
        python -c "import coxdev, coxdev.coxc; print(coxdev.__file__)"
        python -m pytest ../tests --test-size=100
