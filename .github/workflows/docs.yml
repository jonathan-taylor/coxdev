# Build the Jupyter Book in doc/ and deploy it to GitHub Pages.
# Requires Settings -> Pages -> Source: "GitHub Actions".

name: Docs
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'The tag or commit to build docs from'
        required: true
        default: 'main'
        type: string

env:
  # `BASE_URL` determines where the website is served from, including CSS & JS assets
  BASE_URL: /${{ github.event.repository.name }}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name }}
          fetch-depth: 0 # setuptools_scm needs the tags
          submodules: recursive

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Jupyter Book 2 runs on Node
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # glmstar first: it pulls coxdev from PyPI, which `pip install .` then replaces
      - name: Install package and Jupyter Book
        run: |
          pip install --upgrade pip
          pip install meson-python ninja meson pybind11 setuptools_scm
          pip install "glmstar>=0.2.0" pandas matplotlib
          pip install .
          pip install "jupyter-book>=2" ipykernel sphinx sphinx-book-theme

      # The R pages run on the R kernel for Jupyter (IRkernel), with the
      # R package from R/coxdev: no rpy2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install the R package and the R kernel
        run: |
          Rscript -e 'install.packages(c("R6", "Rcpp", "RcppEigen", "survival", "Matrix", "glmnet", "IRkernel"))'
          Rscript -e 'IRkernel::installspec()'
          R CMD INSTALL R/coxdev
          jupyter kernelspec list

      - name: Build HTML
        run: |
          cd doc
          jupyter-book build --html --execute

      # The API reference: Sphinx autodoc, into api/ next to the book
      - name: Build API reference
        run: |
          sphinx-build -b html doc/api doc/_build/html/api
          test -f doc/_build/html/api/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'doc/_build/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
