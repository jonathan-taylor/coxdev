# Build the C API and test CoxDev.jl against it

name: Julia package

# Linux only, when the C++ library, the C API or the Julia package changes
on:
  push:
    branches: [ main ]
    paths: [ 'cpp/**', 'julia/**', '.github/workflows/julia.yml' ]
  pull_request:
    paths: [ 'cpp/**', 'julia/**', '.github/workflows/julia.yml' ]
  workflow_dispatch:

# a new push to a branch cancels the run still going for it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Build the C API and run its C test
      run: |
        cpp/capi/build_local.sh
        cpp/capi/build/test_c_api

    - uses: julia-actions/setup-julia@v2
      with:
        version: '1'

    - uses: julia-actions/cache@v2

    - name: Test CoxDev.jl
      env:
        COXDEV_C_LIB: ${{ github.workspace }}/cpp/capi/build/libcoxdev_c.so
      run: julia --project=julia/CoxDev.jl -e 'using Pkg; Pkg.test()'
