# R CMD check --as-cran of the R package in R/coxdev on the platforms CRAN
# checks, as in jonathan-taylor/lassoinf. Derived from
# https://github.com/r-lib/actions/tree/v2/examples (check-standard); R-hub's
# workflow does not support a package in a subdirectory.
#
# Pull requests: Ubuntu with R-devel and R release. Pushes to main and manual
# runs: also macOS and Windows (release) and Ubuntu with the previous release.
on:
  push:
    branches: [main]
    paths: ['R/coxdev/**', 'cpp/**', '.github/workflows/R-CMD-check.yaml']
  pull_request:
    paths: ['R/coxdev/**', 'cpp/**', '.github/workflows/R-CMD-check.yaml']
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

# a new push to a branch cancels the run still going for it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 45

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config: ${{ github.event_name == 'pull_request' && fromJSON('[{"os":"ubuntu-latest","r":"devel","http-user-agent":"release"},{"os":"ubuntu-latest","r":"release"}]') || fromJSON('[{"os":"macos-latest","r":"release"},{"os":"windows-latest","r":"release"},{"os":"ubuntu-latest","r":"devel","http-user-agent":"release"},{"os":"ubuntu-latest","r":"release"},{"os":"ubuntu-latest","r":"oldrel-1"}]') }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R/coxdev
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: R/coxdev
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          args: 'c("--no-manual", "--as-cran")'
