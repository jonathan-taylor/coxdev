# Check the R package, and test it against the Python package

name: R package

# Linux on pull requests; Linux and macOS on pushes to main (merges) and by
# hand. Changes only to the docs or Markdown files do not run the checks.
on:
  push:
    branches: [ main ]
    paths-ignore: [ 'doc/**', '**.md' ]
  pull_request:
    paths-ignore: [ 'doc/**', '**.md' ]
  workflow_dispatch:

# a new push to a branch cancels the run still going for it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Check the C++ copies in the R package are current
      run: |
        diff cpp/include/coxdev.h R/coxdev/inst/include/coxdev.h
        diff cpp/src/coxdev.cpp R/coxdev/src/coxdev.cpp

    - uses: r-lib/actions/setup-pandoc@v2

    - uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true

    # the Suggests include survival and glmnet, which the Python tests that
    # compare with R (through rpy2) need as well
    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        working-directory: R/coxdev
        extra-packages: any::rcmdcheck
        needs: check

    - uses: r-lib/actions/check-r-package@v2
      with:
        working-directory: R/coxdev
        args: 'c("--no-manual", "--as-cran")'
        error-on: '"warning"'

    - name: Install the R package
      run: R CMD INSTALL R/coxdev

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install the Python package and rpy2
      run: |
        pip install --upgrade pip
        pip install . pytest pandas rpy2

    # every Python test that compares with R through rpy2: survival, glmnet
    # and the R package. COXDEV_REQUIRE_R makes a missing R setup fail them
    # instead of skipping them.
    - name: Test the Python package against R
      env:
        COXDEV_REQUIRE_R: 1
      run: |
        mkdir empty_dir
        cd empty_dir
        python -m pytest ../tests/test_R_package.py ../tests/test_residuals_hazard.py \
          ../tests/test_compareR.py ../tests/test_bad.py --test-size=200 -rs
