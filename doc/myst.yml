version: 1
project:
  title: coxdev
  description: The Cox model's deviance, gradient and Hessian, as a stand-alone class
  authors:
    - name: Jonathan Taylor
    - name: Trevor Hastie
    - name: Balasubramanian Narasimhan
  github: https://github.com/jonathan-taylor/coxdev
  # the API reference (Sphinx autodoc) is built separately into api/ ;
  # see doc/api/conf.py and .github/workflows/docs.yml
  exclude:
    - api/**
    - '*.ipynb'
    - final.md
    - hessian.md
    - Different_tie_types.md
    - _build
  toc:
    - file: index.md
    - title: Using coxdev
      children:
        - file: using_coxdev.md
        - file: sampling.md
    - title: Using coxdev from R
      children:
        - file: r_using_coxdev.md
        - file: r_sampling.md
    - title: Examples
      children:
        - file: examples/penalized_fits.md
        - file: examples/proportional_hazards.md
        - file: examples/residuals.md
    - title: Computations
      children:
        - file: notes_no_ties.md
        - file: notes_ties.md
        - file: notes_hessian.md
        - file: jax_timing.md
    - title: API Reference
      url: https://jonathan-taylor.github.io/coxdev/api/

site:
  options:
    folders: true
  template: book-theme
